<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" constant="width=device-width, initial-scale=1.0">
    <title>Age Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #a8edea, #fed6e3);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: #fff;
            padding: 20px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        h2 {
            margin-bottom: 15px;
            color: #333;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            outline: none;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            border: none;
            background-color:rgb(96, 9, 70);
            color: white;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: pink;
        }

        .result {
            margin-top: 15px;
            font-size: 16px;
            color: #333;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2> Age Calculator</h2>
        <label for="day">Day</label>
        <input type="number" id="day" placeholder="Enter day" min="1" max="31">

        <label for="month">Month</label>
        <input type="number" id="month" placeholder="enter month" min="1" max="12">

        <label for="year">Year</label>
        <input type="number" id="year" placeholder="Enter year" min="1900" max="2100">

        <button onclick="calculateAge()">Calculate Age</button>
        <div class="result" id="result"></div>
    </div>
    <script>
        function calculateAge() {
            let day = parseInt(document.getElementById("day").value);
            let month = parseInt(document.getElementById("month").value);
            let year = parseInt(document.getElementById("year").value);

            if (isNaN(day) || isNaN(month) || isNaN(year)) {
                document.getElementById("result").innerHTML = "Please enter valid date values!";
                return;
            }
            let today = new Date();
            let birthDate = new Date(year, month - 1, day);

            if (birthDate > today) {
                document.getElementById("result").innerHTML = "Birth date cannot be in the future! ";
                return;
            }
            let ageYears = today.getFullYear() - birthDate.getFullYear();
            let ageMonths = today.getMonth() - birthDate.getMonth();
            let ageDays = today.getDate() - birthDate.getDate();

            if (ageDays < 0) {
                ageMonths--;
                let prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                ageDays += prevMonth.getDate();
            }
            if (ageMonths < 0) {
                ageYears--;
                ageMonths += 12;
            }
            document.getElementById("result").innerHTML = `you are ${ageYears} year, ${ageMonths} months, and ${ageDays} days old.`;

        }
    </script>

</body>

</html>
